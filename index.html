<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CourtDay ระบบจัดแข่งแบดมินตัน</title>
<meta name="description" content="สมัครแข่ง ชำระเงิน และดูคะแนนสดแบดมินตัน">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/" aria-label="CourtDay หน้าแรก">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0E1A2B"/><rect x="7" y="8" width="18" height="16" fill="none" stroke="#D6F23D" stroke-width="1.6"/><path d="M16 8v16M7 13h18M7 19h18" stroke="#D6F23D" stroke-width="1.6"/></svg>
      <span>CourtDay</span>
    </a>
    <nav id="nav-right" class="navr"></nav>
  </div>
</header>
<main id="app"><p class="wrap skeleton">กำลังโหลด…</p></main>
<script>
// Shows the real error on screen if the app fails to start (blocked script, network, bad config).
function bootFail(msg) {
  var a = document.getElementById('app');
  if (!a || a.getAttribute('data-ready') === '1') return;
  a.innerHTML = '';
  var s = document.createElement('section'); s.className = 'wrap narrow';
  var p = document.createElement('p'); p.className = 'err';
  p.textContent = 'โหลดหน้าเว็บไม่สำเร็จ: ' + msg;
  var q = document.createElement('p'); q.className = 'muted small';
  q.textContent = 'ลองรีเฟรชหน้านี้ ถ้ายังไม่ได้ส่งข้อความนี้ให้ผู้พัฒนา';
  s.appendChild(p); s.appendChild(q); a.appendChild(s);
}
window.addEventListener('error', function (e) { bootFail(e.message || 'เกิดข้อผิดพลาดของสคริปต์'); });
window.addEventListener('unhandledrejection', function (e) { bootFail((e.reason && e.reason.message) || String(e.reason)); });
</script>
<script type="module" src="js/main.js" onerror="bootFail('โหลดไฟล์ js/main.js ไม่ได้ (ตรวจชื่อโฟลเดอร์ js ตัวพิมพ์เล็ก)')"></script>
</body>
</html>
