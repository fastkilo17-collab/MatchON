<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MatchON กรรมการ</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans Thai','Inter',sans-serif; background:#090d16; color:#f1f5f9; -webkit-tap-highlight-color: transparent; }
    .score { font-variant-numeric: tabular-nums; }
    button { touch-action: manipulation; }
  </style>
</head>
<body class="min-h-screen">
<main class="max-w-lg mx-auto p-4 space-y-4" style="padding-bottom:max(1rem, env(safe-area-inset-bottom))">
  <header class="flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center text-lg">🏸</span>
      <span class="font-extrabold text-lg">Match<span class="text-emerald-400">ON</span></span>
    </div>
    <span id="court-badge" class="text-xs font-extrabold px-2.5 py-1 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30">COURT –</span>
  </header>

  <div id="msg" class="hidden rounded-2xl border border-amber-500/40 bg-amber-500/10 text-amber-200 p-4 text-sm leading-relaxed"></div>

  <section id="pad" class="hidden space-y-4">
    <div>
      <h1 id="round" class="font-bold text-base"></h1>
      <p id="status" class="text-xs text-slate-400"></p>
    </div>

    <div class="flex items-center justify-between bg-slate-900 p-2 rounded-xl border border-slate-800">
      <span class="text-xs font-semibold text-slate-400 pl-2">เซตที่</span>
      <div class="flex gap-1.5" id="sets"></div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center space-y-3">
        <p id="nameA" class="text-sm font-bold truncate"></p>
        <p id="clubA" class="text-[11px] text-slate-400 truncate"></p>
        <div id="scoreA" class="score text-7xl font-extrabold text-emerald-400 py-2">0</div>
        <button id="incA" class="w-full h-16 rounded-2xl bg-emerald-500 active:bg-emerald-400 text-slate-950 font-extrabold text-lg">+1</button>
        <button id="decA" class="w-full h-11 rounded-xl bg-slate-800 active:bg-slate-700 font-bold">− แก้แต้ม</button>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center space-y-3">
        <p id="nameB" class="text-sm font-bold truncate"></p>
        <p id="clubB" class="text-[11px] text-slate-400 truncate"></p>
        <div id="scoreB" class="score text-7xl font-extrabold text-cyan-400 py-2">0</div>
        <button id="incB" class="w-full h-16 rounded-2xl bg-cyan-400 active:bg-cyan-300 text-slate-950 font-extrabold text-lg">+1</button>
        <button id="decB" class="w-full h-11 rounded-xl bg-slate-800 active:bg-slate-700 font-bold">− แก้แต้ม</button>
      </div>
    </div>

    <div class="flex items-center justify-between bg-slate-900 px-4 py-3 rounded-xl border border-slate-800 text-sm">
      <span class="text-slate-300">ลูกแบดที่ใช้</span>
      <div class="flex items-center gap-3">
        <button id="shDec" class="w-10 h-10 rounded-lg bg-slate-800 font-bold">−</button>
        <span id="shuttle" class="font-extrabold text-amber-400 text-lg w-14 text-center">0 ลูก</span>
        <button id="shInc" class="w-10 h-10 rounded-lg bg-slate-800 font-bold">+</button>
      </div>
    </div>

    <button id="finish" class="w-full py-4 rounded-2xl bg-amber-500 active:bg-amber-400 text-slate-950 font-extrabold">🏁 จบแมตช์ และส่งผลเข้าระบบ</button>
    <p id="sync" class="text-center text-[11px] text-slate-500"></p>
  </section>
</main>

<script type="module">
  import * as Live from './js/live.js';

  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const courtNo = Number(q.get('court'));
  const liveId = q.get('live');
  const secret = new URLSearchParams(location.hash.slice(1)).get('k');
  const LOCAL_KEY = 'MATCHON_LOCAL_DB_V1';

  let court = null;          // last known court (from Firebase or local storage)
  let canWrite = false;
  let online = false;
  let noteText = '';
  let setIdx = 0;

  // ---- data layer: Firebase when the link has a live id, otherwise this browser's storage ----
  const local = {
    read() { try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null'); } catch { return null; } },
    court() { const st = local.read(); return st && st.courts && st.courts.find((c) => c.courtNo === courtNo) || null; },
    edit(mutate, extra) {
      const st = local.read(); const c = st && st.courts.find((x) => x.courtNo === courtNo);
      if (!c) return;
      mutate(c); if (extra) extra(st, c);
      localStorage.setItem(LOCAL_KEY, JSON.stringify(st));
    },
  };

  const show = (text) => { $('msg').textContent = text; $('msg').classList.remove('hidden'); $('pad').classList.add('hidden'); };

  function currentSet(c) {
    if (Number.isInteger(c.activeSet) && c.activeSet >= 0) return c.activeSet;
    let last = 0; c.scores.forEach((s, i) => { if (s[0] || s[1]) last = i; });
    return last;
  }

  function draw() {
    $('court-badge').textContent = 'COURT ' + (courtNo || '–');
    if (!courtNo) return show('ลิงก์นี้ไม่ระบุคอร์ต ให้สแกน QR จากหน้า "สายแข่ง & คอร์ทสด" ของแต่ละคอร์ต');
    const c = court;
    if (!c) return show(liveId ? 'กำลังเชื่อมต่อ… ถ้านานเกิน 10 วินาทีให้ตรวจอินเทอร์เน็ต หรือผู้จัดยังไม่ได้เปิดข้อมูลคอร์ตนี้' : 'ไม่พบข้อมูลคอร์ตนี้ในเครื่องนี้ ให้สแกน QR ใหม่จากหน้าผู้จัด');
    $('msg').classList.add('hidden'); $('pad').classList.remove('hidden');
    setIdx = currentSet(c);
    const live = c.status === 'LIVE';
    $('round').textContent = c.round;
    $('status').textContent = live ? '● กำลังแข่งขัน' : 'คอร์ตว่าง รอผู้จัดเรียกคู่ลงสนาม';
    $('nameA').textContent = c.teamA; $('clubA').textContent = c.clubA;
    $('nameB').textContent = c.teamB; $('clubB').textContent = c.clubB;
    $('scoreA').textContent = c.scores[setIdx][0];
    $('scoreB').textContent = c.scores[setIdx][1];
    $('shuttle').textContent = c.shuttleUsed + ' ลูก';
    $('sets').innerHTML = [0, 1, 2].map((i) =>
      `<button data-set="${i}" class="px-4 py-2 rounded-lg text-sm font-bold ${i === setIdx ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-300'}">${i + 1}</button>`).join('');
    const enabled = live && canWrite;
    ['incA', 'decA', 'incB', 'decB', 'shInc', 'shDec', 'finish'].forEach((id) => { $(id).disabled = !enabled; $(id).classList.toggle('opacity-40', !enabled); });
    $('sets').querySelectorAll('button').forEach((b) => { b.disabled = !canWrite; });
    const net = !liveId ? 'โหมดในเครื่อง (ไม่ซิงก์ข้ามเครื่อง)' : online ? '● ซิงก์สดกับผู้จัดแล้ว' : '○ ออฟไลน์ ระบบจะส่งเมื่อกลับมาออนไลน์';
    $('sync').textContent = (noteText ? noteText + ' · ' : '') + net;
    $('sync').className = 'text-center text-[11px] ' + (liveId && !online ? 'text-amber-400' : 'text-slate-500');
  }

  async function commit(mutate, extraLocal) {
    if (!canWrite) return;
    if (liveId) {
      try { await Live.updateCourt(liveId, courtNo, mutate); } catch (e) { noteText = 'ส่งไม่สำเร็จ: ' + (e.code || e.message); draw(); return; }
    } else {
      local.edit(mutate, extraLocal); court = local.court();
    }
    noteText = 'บันทึกล่าสุด ' + new Date().toLocaleTimeString('th-TH');
    draw();
  }

  $('sets').addEventListener('click', (e) => { const b = e.target.closest('[data-set]'); if (b) { const i = Number(b.dataset.set); commit((c) => { c.activeSet = i; }); } });
  $('incA').onclick = () => commit((c) => { c.scores[currentSet(c)][0] += 1; });
  $('incB').onclick = () => commit((c) => { c.scores[currentSet(c)][1] += 1; });
  $('decA').onclick = () => commit((c) => { const s = c.scores[currentSet(c)]; if (s[0] > 0) s[0] -= 1; });
  $('decB').onclick = () => commit((c) => { const s = c.scores[currentSet(c)]; if (s[1] > 0) s[1] -= 1; });
  $('shInc').onclick = () => commit((c) => { c.shuttleUsed += 1; });
  $('shDec').onclick = () => commit((c) => { if (c.shuttleUsed > 0) c.shuttleUsed -= 1; });

  $('finish').onclick = async () => {
    if (!court || !confirm('จบแมตช์นี้และบันทึกผล?')) return;
    const c = court;
    const aWin = c.scores[0][0] >= c.scores[0][1];
    const done = {
      code: c.matchCode || ('M-' + Math.floor(105 + Math.random() * 80)),
      round: c.round,
      winner: aWin ? `${c.teamA} (${c.clubA})` : `${c.teamB} (${c.clubB})`,
      loser: aWin ? `${c.teamB} (${c.clubB})` : `${c.teamA} (${c.clubA})`,
      scoreText: c.scores.filter((s, i) => i === 0 || s[0] > 0 || s[1] > 0).map((s) => s[0] + '-' + s[1]).join(', '),
      shuttleUsed: c.shuttleUsed,
      time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.',
    };
    const reset = (x) => {
      x.status = 'READY'; x.matchCode = ''; x.round = 'คอร์ทว่าง (พร้อมเรียกคู่ถัดไป)';
      x.teamA = 'รอเรียกคู่แข่งขัน'; x.clubA = '-'; x.teamB = 'รอเรียกคู่แข่งขัน'; x.clubB = '-';
      x.scores = [[0, 0], [0, 0], [0, 0]]; x.shuttleUsed = 0; x.activeSet = -1;
    };
    if (liveId) {
      try { await Live.addCompleted(liveId, done); } catch (e) { noteText = 'บันทึกผลไม่สำเร็จ: ' + (e.code || e.message); return draw(); }
      await commit(reset);
    } else {
      await commit(reset, (st) => { (st.completedMatches = st.completedMatches || []).unshift(done); });
    }
  };

  // ---- start ----
  draw();
  if (liveId) {
    Live.connect(liveId, secret).then((r) => {
      canWrite = r.canWrite;
      if (r.error === 'auth') noteText = 'เปิดใช้ Anonymous sign-in ใน Firebase ก่อน (' + (r.detail || '') + ')';
      else if (r.error === 'nokey' || r.error === 'badkey') noteText = 'ลิงก์ไม่มีรหัสกรรมการ ดูอย่างเดียว ให้สแกน QR ใหม่';
      draw();
    });
    Live.watchConnection((on) => { online = on; draw(); });
    Live.watchCourt(liveId, courtNo, (c) => { court = c; draw(); });
  } else {
    canWrite = true;
    court = local.court();
    window.addEventListener('storage', (e) => { if (e.key === LOCAL_KEY) { court = local.court(); draw(); } });
    draw();
  }
</script>
</body>
</html>
