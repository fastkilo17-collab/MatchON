<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MatchON กรรมการ</title>
<link rel="icon" type="image/png" href="img/matchon-icon.png">
<link rel="apple-touch-icon" href="img/matchon-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* The whole screen is one 1536x1024 canvas that is scaled to fit, so it matches the design exactly on any device. */
:root{
  --bg:#050a1a; --ink:#f4f7ff; --mute:#9db0dc; --line:#1c3b9a;
  --a:#1f6bff; --a2:#0a3bb8; --b:#e11d3a; --b2:#9b0f27; --lime:#ffe04a; --go:#22c55e; --amber:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai','Prompt',sans-serif}
body{min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;user-select:none}
button:disabled{opacity:.38;cursor:not-allowed}
.num{font-family:'Prompt',sans-serif;font-variant-numeric:tabular-nums}
#wrap{position:relative;margin:auto 0}
#cv{position:absolute;left:0;top:0;width:var(--W,1536px);min-height:0;transform-origin:0 0;padding:10px 16px 12px;display:flex;flex-direction:column;gap:8px;
  background:radial-gradient(1100px 520px at 50% 0,#102a78 0,transparent 62%),radial-gradient(900px 500px at 100% 100%,#1a1470 0,transparent 60%),linear-gradient(#060d2a,#050a1a)}

/* ---------- header ---------- */
.hd{height:84px;flex:none;display:flex;align-items:center;gap:22px;padding:0 6px;border-bottom:2px solid #1b3a9a;box-shadow:0 8px 18px -12px #2a63ff}
.logo{display:flex;flex-direction:column;align-items:flex-start;gap:0;width:330px;flex:none}
.logo img{height:52px;width:auto;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.logo small{font:500 15px 'Noto Sans Thai';color:#c9d6ff;letter-spacing:.3px;margin-left:6px}
.vdiv{width:2px;height:54px;background:linear-gradient(transparent,#2a4aa8,transparent);flex:none}
.ttl{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;gap:18px}
.ttl .cup{font-size:50px;filter:drop-shadow(0 0 10px #f5b50a88)}
.ttl strong{display:block;font:700 26px 'Noto Sans Thai';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ttl span{font:500 22px 'Noto Sans Thai';color:#dbe5ff}
.livep{display:flex;align-items:center;gap:10px;padding:0 24px;height:50px;border-radius:99px;border:2px solid #2c7a45;background:#0a2a1c;font:700 28px 'Prompt';color:#2bdc6b;flex:none}
.livep i{width:18px;height:18px;border-radius:50%;background:#22c55e;box-shadow:0 0 12px #22c55e}
.livep.paused{border-color:#9a6a12;background:#2a1c06;color:#ffb62e}.livep.paused i{background:#f59e0b;box-shadow:0 0 12px #f59e0b}
.livep.idle{border-color:#334066;background:#0b1430;color:#9db0dc}.livep.idle i{background:#64748b;box-shadow:none}
.clk{display:flex;align-items:center;gap:12px;font:600 32px 'Prompt';flex:none}
.clk svg{width:34px;height:34px}
.ib{width:52px;height:52px;border-radius:14px;background:transparent;font-size:30px;display:grid;place-items:center;flex:none;color:#9fb5f5}
.ib:active{background:#ffffff1a}

/* ---------- scoreboard ---------- */
.bd{height:272px;flex:none;display:flex;gap:12px;margin-top:4px}
.tc{width:402px;flex:none;position:relative;border-radius:20px;overflow:hidden;border:2px solid var(--c);display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--c2),#071a4c);box-shadow:0 0 22px -4px var(--c)}
.tc[data-t="A"]{--c:#2f74ff;--c2:#0b3ec4}.tc[data-t="B"]{--c:#ff3a57;--c2:#8a1024;background:linear-gradient(180deg,#8a1024,#3e0712)}
.tc h2{height:58px;display:block;line-height:58px;text-align:center;background:#ffffff1c;font:700 31px/58px 'Noto Sans Thai';padding:0 64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.tc .ph{flex:1;display:flex;justify-content:center;align-items:center;gap:16px;padding:10px 0 4px}
.pic{width:176px;height:146px;border-radius:12px;overflow:hidden;border:2px solid #cfe0ff;background:linear-gradient(#4a8bff,#1a3f9a);display:grid;place-items:center;font:800 78px 'Prompt';color:#ffffffd9}
.tc[data-t="B"] .pic{background:linear-gradient(#ff6b83,#9b1230)}
.pic img{width:100%;height:100%;object-fit:cover}
.tc .nm{height:48px;display:grid;place-items:center;font:600 27px 'Noto Sans Thai';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px}
.sv{position:absolute;top:8px;width:42px;height:42px;border-radius:50%;background:#16a34a;display:none;place-items:center;box-shadow:0 0 16px #22c55e;border:2px solid #b8ffd2}
.tc[data-side="L"] .sv{left:12px}.tc[data-side="R"] .sv{right:12px}
.sv.on{display:grid;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 5px #22c55e}}
.sv svg{width:30px;height:30px}

.cn{flex:1;position:relative;min-width:0}
.rulet{position:absolute;right:calc(50% + 148px);top:6px;max-width:calc(50% - 150px);text-align:right;font:600 17px/1.25 'Noto Sans Thai';color:#9fb0d0;z-index:2;overflow:hidden}
.cat{position:absolute;left:50%;top:0;transform:translateX(-50%);width:276px;height:54px;border-radius:14px 14px 0 0;background:linear-gradient(#6a2fd6,#4a1aa6);border:2px solid #8e63ff;border-bottom:0;display:grid;place-items:center;font:700 31px 'Noto Sans Thai';z-index:2;clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat:empty{visibility:hidden}
.sb{position:absolute;top:54px;bottom:0;width:262px;display:flex;flex-direction:column;overflow:hidden}
.sb.L{left:0;clip-path:polygon(0 0,90% 0,100% 100%,0 100%);border-radius:18px 0 0 18px}
.sb.R{right:0;clip-path:polygon(10% 0,100% 0,100% 100%,0 100%);border-radius:0 18px 18px 0}
.sb .n{flex:1;display:grid;place-items:center;font:800 150px/1 'Prompt';color:#fff;text-shadow:0 6px 18px #0008}
.sb .l{height:42px;display:grid;place-items:center;font:700 25px 'Noto Sans Thai';background:#ffffff26}
.sb[data-t="A"]{background:linear-gradient(180deg,#2e78ff,#0a3bb8);box-shadow:inset 0 0 0 2px #6aa0ff}
.sb[data-t="B"]{background:linear-gradient(180deg,#f0344f,#8d0c22);box-shadow:inset 0 0 0 2px #ff8195}
.mid{position:absolute;left:50%;top:54px;bottom:0;width:230px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;
  background:linear-gradient(#040a22,#070f30);border-top:1px solid #1d2f70}
.mid .s{margin-top:18px;font:700 34px 'Prompt';color:#8fb4ff;letter-spacing:2px}
.mid .w{font:800 84px/1 'Prompt';color:#fff;white-space:nowrap}
.mid .w b{color:var(--lime);font-weight:800}
.mid .st{width:100%;height:42px;display:grid;place-items:center;font:700 25px 'Noto Sans Thai';background:#0b1642;color:#e9f0ff;border-top:1px solid #20357d;white-space:nowrap}

/* ---------- point history strip ---------- */
.hs{height:40px;flex:none;display:flex;align-items:center;gap:12px;border-radius:12px;background:linear-gradient(90deg,#08122f,#0b1740);border:2px solid #1b3a9a;padding:0 12px}
.hs .lab{font:700 20px 'Noto Sans Thai';color:#cfe0ff;white-space:nowrap;flex:none;width:150px}
.hs .cells{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;align-items:center;height:100%}
.hs .cells::-webkit-scrollbar{display:none}
.hs .c{flex:none;min-width:28px;height:26px;border-radius:7px;display:grid;place-items:center;font:700 15px 'Prompt';color:#fff;padding:0 4px}
.hs .c.A{background:linear-gradient(#2f74ff,#1445c0)}.hs .c.B{background:linear-gradient(#ff3a57,#a2132b)}.hs .c.pre{background:#26335f;color:#9db0dc}
.hs .none{font:500 18px 'Noto Sans Thai';color:#7f93c6}
.hs .lg{display:flex;gap:16px;font:600 17px 'Noto Sans Thai';color:#cfe0ff;flex:none}
.hs .lg i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}

/* ---------- info strip ---------- */
.is{height:66px;flex:none;display:flex;align-items:center;gap:0;border-radius:14px;background:linear-gradient(90deg,#08122f,#0b1740);border:2px solid #1b3a9a;padding:0 12px}
.is .it{display:flex;align-items:center;gap:12px;padding:0 22px;height:44px;border-right:2px solid #1d2f70;flex:none}
.is .it:last-child{border:0;margin-left:auto;padding-right:6px}
.is .it:first-child{padding-left:8px}
.is .lbl{font:600 24px 'Noto Sans Thai';color:#eaf1ff}
.is .big{font:800 38px 'Prompt';color:var(--lime)}
.pill{padding:5px 22px;border-radius:99px;font:700 24px 'Noto Sans Thai';background:#1d5fe0;white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis}
.pill.B{background:#d11b38}.pill.none{background:#26335f;color:#9db0dc}
.setbtns{display:flex;gap:8px}
.sbtn{width:50px;height:44px;border-radius:11px;background:#16255a;border:2px solid #2b4aa8;font:800 25px 'Prompt';color:#cfe0ff;position:relative}
.sbtn.view{background:linear-gradient(#2f74ff,#1445c0);border-color:#9cc0ff;color:#fff}
.sbtn.cur::after{content:"";position:absolute;right:-4px;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime)}
.tm small{display:block;font:500 17px 'Noto Sans Thai';color:#b8c9f5;line-height:1}
.tm b{font:700 30px/1.1 'Prompt'}
.stat{display:flex;align-items:center;gap:10px;padding:0 26px;height:48px;border-radius:12px;background:linear-gradient(#1fa14d,#0f7a36);border:2px solid #4ade80;font:700 27px 'Noto Sans Thai'}
.stat.paused{background:linear-gradient(#c58210,#8a5a08);border-color:#fbbf24}
.stat.idle{background:linear-gradient(#3a4a7a,#26335f);border-color:#6b7fb8}

/* ---------- panels ---------- */
.pr{height:262px;flex:none;display:grid;grid-template-columns:490px 310px 327px 1fr;gap:20px}
.pn{border-radius:16px;border:2px solid #1c40a8;background:linear-gradient(180deg,#0a1640,#071030);padding:10px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:0 0 20px -8px #2a63ff}
.pn h3{white-space:nowrap;display:flex;align-items:center;gap:12px;font:700 27px 'Noto Sans Thai';height:36px;flex:none}
.pn h3 em{font-style:normal;font-size:30px}
.bt{border-radius:12px;font:700 25px 'Noto Sans Thai';display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;border:2px solid #ffffff2a;padding:0 10px;white-space:nowrap}
.bt:active:not(:disabled){transform:translateY(2px);filter:brightness(1.15)}
.bt.A{background:linear-gradient(#2f74ff,#0f43c4)}.bt.B{background:linear-gradient(#f0344f,#a1122a)}
.bt.g{background:linear-gradient(#3a4a8a,#242f66);border-color:#5470c8}
.bt.go{background:linear-gradient(#22b04e,#0f7a36)}.bt.bl{background:linear-gradient(#2f74ff,#1445c0)}.bt.or{background:linear-gradient(#fb923c,#c2410c)}.bt.ye{background:linear-gradient(#fbbf24,#d99a06);color:#241800}
.sc{flex:1;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;min-height:0}
.sc .bt{font:700 36px 'Prompt'}
.sc .swp{grid-column:3;grid-row:1/3;flex-direction:column;font:700 17px 'Noto Sans Thai';gap:4px;padding:0 2px}
.sc .swp svg{width:34px;height:34px}
.back{height:46px;flex:none;font-size:26px}
.sh{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:62px 1fr;gap:8px;min-height:0}
.sh .bt{font:700 36px 'Prompt'}
.sh .cnt{grid-column:1/3;border-radius:12px;background:#050c26;border:2px solid #1b2f78;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.sh .cnt small{font:500 22px 'Noto Sans Thai';color:#dbe5ff}
.sh .cnt b{font:800 64px/1.05 'Prompt';color:var(--lime)}
.sh .cnt b i{font-style:normal;font-weight:500;font-size:34px;color:#7186b8}
.sv2{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.sv2 .bt{flex:1;min-height:0;font-size:25px;position:relative}
.sv2 .bt.sel{outline:3px solid #fff;outline-offset:-5px}
.sv2 .bt svg{width:30px;height:30px}
.stp{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0}
.stp .bt{flex:1;min-height:0;font-size:24px;justify-content:flex-start;padding-left:20px}
.stp .bt .ic{width:34px;text-align:center;font-size:27px;flex:none}

/* ---------- bottom row ---------- */
.bm{height:208px;flex:none;display:grid;grid-template-columns:507px 477px 272px 1fr;gap:18px}
table{width:100%;border-collapse:collapse;font:600 24px 'Noto Sans Thai'}
th{font:500 21px 'Noto Sans Thai';color:#b8c9f5;padding:6px 4px;text-align:center;border-bottom:1px solid #1f3585}
td{padding:8px 6px;text-align:center;border-bottom:1px solid #1a2d70}
td:first-child,th:first-child{text-align:left}
td:first-child{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td:first-child i{display:inline-block;width:9px;height:28px;border-radius:5px;margin-right:10px;vertical-align:middle}
td.w{color:var(--lime);font:800 32px 'Prompt'}td.n{font:700 32px 'Prompt'}td.x{color:#6a7db0}
tr:last-child td{border-bottom:0}
.evh{display:flex;justify-content:space-between;align-items:center}
.evh button{background:none;color:#9bbcff;font:500 21px 'Noto Sans Thai'}
.ev{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow:hidden}
.ev div{display:flex;gap:16px;font:500 23px 'Noto Sans Thai';padding:6px 8px;border-bottom:1px solid #1a2d70;white-space:nowrap}
.ev div b{font:500 22px 'Prompt';color:#8da3d8;flex:none}
.ev div span{overflow:hidden;text-overflow:ellipsis}
.inf{display:flex;flex-direction:column;gap:8px;font:500 22px 'Noto Sans Thai'}
.inf div{display:flex;gap:16px}.inf b{font-weight:500;color:#b8c9f5;min-width:94px}
.art{position:relative}
.art svg{position:absolute;right:-6px;bottom:-4px;width:240px;height:210px}

/* ---------- overlays ---------- */
.msg{position:fixed;inset:0;display:none;place-items:center;background:var(--bg);padding:24px;z-index:20;text-align:center;line-height:1.7;font-size:20px}
.msg.on{display:grid}.msg div{max-width:560px;color:#fde68a}
.rot{position:fixed;inset:0;display:none;place-items:center;background:#050a1af2;z-index:15;text-align:center;font:700 22px/1.7 'Noto Sans Thai';padding:30px}
.rot span{display:block;font-size:64px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0b1226f2;border:1px solid #2b4aa8;padding:10px 18px;border-radius:99px;font-size:15px;z-index:30;display:none;max-width:92vw;text-align:center}
.toast.on{display:block}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:25;padding:16px}
.modal.on{display:grid}
.sheet{background:#0b1640;border:2px solid #1c40a8;border-radius:18px;padding:18px;width:min(460px,100%);max-height:86vh;display:flex;flex-direction:column;gap:12px}
.sheet h3{font:700 20px 'Prompt'}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#12206a;border-radius:12px;padding:12px 14px;width:100%;text-align:left;font-size:16px}
.row small{color:var(--mute);display:block}
.sw{width:48px;height:28px;border-radius:99px;background:#334155;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:#16a34a}.sw.on::after{left:23px}
.close{background:#1e293b;border-radius:12px;padding:12px;font-weight:700;font-size:16px}
.evlist{overflow:auto;display:flex;flex-direction:column;gap:2px;font-size:15px}
.evlist div{display:flex;gap:12px;padding:6px 4px;border-bottom:1px solid #1a2d70}.evlist b{font-weight:500;color:#8da3d8;flex:none}


/* ---- v2 layout: everything on one screen ---- */
.hd{height:80px}
.bd{height:262px}
.hs{height:60px;gap:14px;padding:0 12px}
.hs .setbtns{display:flex;gap:8px;flex:none}
.hs .sbtn{width:54px;height:44px}
.hs .cells{height:100%}
.tm{display:flex;align-items:center;gap:10px;flex:none;border-left:2px solid #1d2f70;padding-left:16px}
.tm b{font:700 32px/1 'Prompt'}
.mr{flex:1;min-height:0;display:grid;grid-template-columns:402px 1fr 402px;gap:12px}
.mr .pn{min-height:0}
.sc{flex:1;display:grid;grid-template-columns:1fr 96px 1fr;grid-template-rows:3fr 1fr;gap:10px;min-height:0}
.sc .bt{font:800 84px 'Prompt'}
.sc [id^="mi"],.sc [id^="mr"]{font-size:40px}
.sc .swp{grid-column:2;grid-row:1/3;grid-area:auto;font:700 18px 'Noto Sans Thai'}
#pl1{grid-column:1;grid-row:1}#pr1{grid-column:3;grid-row:1}#mi1{grid-column:1;grid-row:2}#mr1{grid-column:3;grid-row:2}
.back{height:52px}
.shc{display:flex;align-items:center;gap:8px}
.shc .bt{width:46px;height:46px;font:700 30px 'Prompt';padding:0}
.shc b{min-width:44px;text-align:center;font:800 34px 'Prompt';color:var(--lime)}
.pn h3{font-size:24px}
table{font-size:22px}
td:first-child{max-width:150px}
.ev{gap:4px}.ev div{font-size:21px}
.stp{height:96px;flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0}
.stp .bt{font-size:30px;justify-content:center;padding:0 10px}
.stp .bt .ic{font-size:32px}
.pic{position:relative;overflow:visible;cursor:default}
.pic .pi{position:absolute;inset:0;border-radius:10px;overflow:hidden;display:grid;place-items:center}
.pic .pi img{width:100%;height:100%;object-fit:cover}
.pic .ball{position:absolute;right:-8px;bottom:-8px;width:52px;height:52px;border-radius:50%;background:#16a34a;border:3px solid #b8ffd2;display:grid;place-items:center;box-shadow:0 0 16px #22c55e;z-index:3}
.pic .ball svg{width:34px;height:34px}
.ph.canswap .pic{cursor:pointer}
.ttl strong{font-size:24px}.ttl span{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* ---- v3 ---- */
.sb{width:calc(50% - 90px)}
.sb.L{clip-path:polygon(0 0,100% 0,calc(100% - 26px) 100%,0 100%)}
.sb.R{clip-path:polygon(26px 0,100% 0,100% 100%,0 100%)}
.mid .w{font-size:64px}.mid .s{font-size:32px}
.tc .ph{align-items:flex-start;gap:16px;padding:12px 0 0}
.pw{display:flex;flex-direction:column;align-items:center;gap:4px;width:176px}
.pw .pnm{font:600 25px/1.2 'Noto Sans Thai';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:176px;text-align:center}
.pic .real{position:absolute;left:0;right:0;bottom:0;padding:14px 4px 5px;border-radius:0 0 10px 10px;background:linear-gradient(transparent,#000a);font:600 19px/1.15 'Noto Sans Thai';text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}
.pic .pi{font-size:70px}
.sc{display:grid;grid-template-columns:1fr 170px 1fr;grid-template-rows:146px 1fr;gap:12px;align-content:start;justify-items:center;padding-top:18px}
.sc>.bt{width:176px;font:800 76px 'Prompt'}
#pl1,#pr1{height:146px}
#mi1,#mr1{height:84px;align-self:start;font-size:42px}
.mc{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;gap:12px;width:100%;align-self:stretch;padding-bottom:12px}
.mc{align-self:start;padding-bottom:0}.mc .bt{flex:none;height:146px;flex-direction:column;font:700 21px 'Noto Sans Thai';gap:6px;grid-area:auto}
.mc .bt svg{width:38px;height:38px}
.stp{display:grid;grid-template-columns:1fr;grid-template-rows:repeat(4,1fr);gap:12px;height:auto}
.rad{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:16px;flex-wrap:wrap}
.rad input{width:20px;height:20px;accent-color:#2f74ff}
.rad small{width:100%;margin-left:30px}

<script type="module">
import * as Live from './js/live.js';

const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const courtNo = Number(q.get('court'));
const liveId = q.get('live');
const secret = new URLSearchParams(location.hash.slice(1)).get('k');
const umpire = (q.get('ref') || '').trim();
const LOCAL_KEY = 'MATCHON_LOCAL_DB_V1';
const PREF = 'matchon.referee.prefs';
const SHUTTLE_CAP = 21;
const RULE0 = { best_of: 3, points: 21, cap: 30, deuce: true, playTwo: false };
const R = (c) => Object.assign({}, RULE0, (c && c.rule) || {});
const maxSets = (c) => { const r = R(c); return r.playTwo ? 2 : Math.max(1, r.best_of || 3); };

let court = null, canWrite = false, online = false, note = '', revoked = false;
let viewSet = null;              // set shown on screen; null = follow the set being played
let prefs = { flip: false, wake: false, fit: 'fit' };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF) || '{}')); } catch {}
const savePrefs = () => { try { localStorage.setItem(PREF, JSON.stringify(prefs)); } catch {} };

/* ---------------- canvas scaling ---------------- */
function fit() {
  const W = innerWidth, H = innerHeight, cv = $('cv'), wrap = $('wrap');
  const portrait = H > W * 1.05;
  document.body.classList.toggle('pt', portrait);
  const DW = portrait ? 820 : 1536;
  cv.style.setProperty('--W', DW + 'px');
  fitTexts();
  const CH = cv.offsetHeight || 1024;                                   // natural height of the page (no empty space)
  const k = (prefs.fit === 'fill' || portrait) ? W / DW : Math.min(W / DW, H / CH);
  wrap.style.width = DW * k + 'px'; wrap.style.height = CH * k + 'px';
  cv.style.transform = `scale(${k})`;
  document.documentElement.style.overflowY = (portrait || CH * k > H + 1) ? 'auto' : 'hidden';   // scroll down when the page is taller than the screen
}
// shrink a text until it fits its box (team names are shown as large as they can be)
function fitTexts() {
  document.querySelectorAll('.tc h2,.pnm,#tsub').forEach((el) => {
    const max = el.classList.contains('pnm') ? 25 : el.id === 'tsub' ? 20 : 34;
    el.style.fontSize = max + 'px';
    let sz = max;
    while (el.scrollWidth > el.clientWidth + 1 && sz > 11) { sz -= 1; el.style.fontSize = sz + 'px'; }
  });
}
addEventListener('resize', fit); fit(); setTimeout(fit, 400); setTimeout(fit, 1500);
// content height changes when the court data arrives -> re-fit so scrolling works without pressing a button first
let lastH = 0;
if (window.ResizeObserver) new ResizeObserver(() => { const h = $('cv').offsetHeight; if (h !== lastH) { lastH = h; fit(); } }).observe($('cv')); if (document.fonts) document.fonts.ready.then(fit);

/* ---------------- icons ---------------- */
// shuttlecock, drawn upright and tilted 45 degrees
const shuttle = (size = 30, tilt = true, color = '#fff') => `<svg width="${size}" height="${size}" viewBox="0 0 32 32" style="${tilt ? 'transform:rotate(45deg)' : ''}">
  <path d="M11.5 22 L5.5 6 Q16 1.5 26.5 6 L20.5 22 Z" fill="${color}" fill-opacity=".92"/>
  <path d="M16 22 L9 5M16 22 L16 3.5M16 22 L23 5M13 22 L6.8 6.5M19 22 L25.2 6.5" stroke="#7d8db8" stroke-width=".9" fill="none"/>
  <path d="M5.5 6 Q16 1.5 26.5 6" stroke="#4f6bd0" stroke-width="1.6" fill="none"/>
  <ellipse cx="16" cy="25" rx="5" ry="4.3" fill="#f3e3c4" stroke="#b79a64" stroke-width=".8"/></svg>`;

/* ---------------- data layer ---------------- */
const local = {
  read() { try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null'); } catch { return null; } },
  court() { const st = local.read(); return (st && st.courts && st.courts.find((c) => c.courtNo === courtNo)) || null; },
  edit(mutate, extra) {
    const st = local.read(); const c = st && st.courts.find((x) => x.courtNo === courtNo);
    if (!c) return;
    mutate(c); if (extra) extra(st, c);
    localStorage.setItem(LOCAL_KEY, JSON.stringify(st));
  },
};
const ensure = (c) => {
  c.log = Array.isArray(c.log) ? c.log : [];
  c.events = Array.isArray(c.events) ? c.events : [];
  c.scores = c.scores || [[0, 0], [0, 0], [0, 0]];
  if (!Number.isInteger(c.activeSet) || c.activeSet < 0) { let l = 0; c.scores.forEach((s, i) => { if (s[0] || s[1]) l = i; }); c.activeSet = l; }
  return c;
};

/* ---------------- game logic ---------------- */
const T = (t) => (t === 'A' ? 0 : 1);
const OTHER = (t) => (t === 'A' ? 'B' : 'A');
const act = (c) => ensure(c).activeSet;
const began = (c) => !!c.startedAt || c.scores.some((s) => s[0] || s[1]);
const players = (c, t) => String(t === 'A' ? c.teamA : c.teamB || '');
const clubOf = (c, t) => (t === 'A' ? c.clubA : c.clubB);
const teamName = (c, t) => { const k = clubOf(c, t); return k && k !== '-' ? k : players(c, t); };
const names = (c, t) => players(c, t).split('/').map((p) => p.trim()).filter(Boolean);
// who is serving: the saved value, otherwise the last scorer, otherwise team A once the game has started
const server = (c) => c.server === 'A' || c.server === 'B' ? c.server : (c.log.length ? c.log[c.log.length - 1][0] : 'A');
const setWinner = (s, c) => {
  const r = R(c), hi = Math.max(s[0], s[1]), lead = Math.abs(s[0] - s[1]);
  if (s[0] === s[1]) return '';
  const w = s[0] > s[1] ? 'A' : 'B';
  if (!r.deuce) return hi >= r.points ? w : '';
  return (hi >= r.cap) || (hi >= r.points && lead >= 2) ? w : '';
};
function setsWon(c) { const cur = act(c); let a = 0, b = 0; c.scores.forEach((s, i) => { if (i < cur) { if (s[0] > s[1]) a++; else if (s[1] > s[0]) b++; } }); return [a, b]; }
const pushEv = (c, txt) => { c.events.push({ at: Date.now(), txt }); if (c.events.length > 40) c.events.splice(0, c.events.length - 40); };

const addPoints = (t, n) => (c) => {
  ensure(c); const i = act(c);
  if (!c.log.some((e) => Number(e[1]) === i)) { c.firstSrv = Array.isArray(c.firstSrv) ? c.firstSrv.slice(0, 3) : []; while (c.firstSrv.length < 3) c.firstSrv.push(''); c.firstSrv[i] = server(c) || 'A'; }
  for (let k = 0; k < n; k++) { c.scores[i][T(t)] += 1; c.log.push(t + i); }
  c.server = t;
  pushEv(c, `คะแนน ${teamName(c, t)} ${c.scores[i][T(t)]} - ${c.scores[i][T(OTHER(t))]}`);
};
const subPoints = (t, n) => (c) => {
  ensure(c); const i = act(c); let took = 0;
  for (let k = 0; k < n; k++) {
    if (c.scores[i][T(t)] <= 0) break;
    c.scores[i][T(t)] -= 1; took++;
    const at = c.log.lastIndexOf(t + i); if (at >= 0) c.log.splice(at, 1);
  }
  if (took) pushEv(c, `แก้คะแนน ${teamName(c, t)} -${took} (${c.scores[i][0]} - ${c.scores[i][1]})`);
};
const undo = (c) => {
  ensure(c);
  const last = c.log.pop(); if (!last) return;
  const t = last[0], i = Number(last[1]);
  if (c.scores[i][T(t)] > 0) c.scores[i][T(t)] -= 1;
  c.activeSet = i;
  const prev = c.log[c.log.length - 1]; if (prev) c.server = prev[0];
  pushEv(c, `ย้อนกลับ แต้มล่าสุดของ ${teamName(c, t)}`);
};
const playPause = (c) => {
  ensure(c); const now = Date.now();
  if (!began(c)) { c.startedAt = now; c.paused = false; if (!c.shuttleUsed) c.shuttleUsed = 1; pushEv(c, 'เริ่มการแข่งขัน'); }
  else if (!c.startedAt) { c.startedAt = now; c.paused = true; c.pausedAt = now; pushEv(c, 'พักการแข่งขัน'); }
  else if (c.paused) { c.pausedTotal = (c.pausedTotal || 0) + (now - (c.pausedAt || now)); c.pausedAt = 0; c.paused = false; pushEv(c, 'เล่นต่อ'); }
  else { c.paused = true; c.pausedAt = now; pushEv(c, 'พักการแข่งขัน'); }
};
const endSetMut = (c) => { ensure(c); const i = act(c); pushEv(c, `จบเซต ${i + 1}: ${c.scores[i][0]} - ${c.scores[i][1]}`); c.activeSet = Math.min(maxSets(c) - 1, i + 1); };

/* ---------------- rendering ---------------- */
const side = () => (prefs.flip ? { L: 'B', R: 'A' } : { L: 'A', R: 'B' });
const hms = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map((x) => String(x).padStart(2, '0')).join(':'); };
const clockTxt = (ms) => new Date(ms).toLocaleTimeString('th-TH', { hour12: false });
const toast = (t) => { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.k); toast.k = setTimeout(() => el.classList.remove('on'), 2600); };
const showMsg = (t) => { $('msgTxt').textContent = t; $('msg').classList.add('on'); };
const esc = (s) => String(s).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const safeUrl = (u) => (/^(https?:|data:image\/|img\/)/.test(u || '') ? u : '');

function elapsed(c) {
  if (!c.startedAt) return 0;
  const end = c.paused && c.pausedAt ? c.pausedAt : Date.now();
  return end - c.startedAt - (c.pausedTotal || 0);
}

function draw() {
  if (revoked) return showMsg('QR / ลิงก์นี้ถูกยกเลิกแล้ว (ผู้จัดเปลี่ยน QR ใหม่) กรุณาขอสแกน QR ใหม่จากผู้จัด');
  if (!courtNo) return showMsg('ลิงก์นี้ไม่ระบุคอร์ต ให้สแกน QR จากหน้า "สายแข่ง & คอร์ทสด" ของแต่ละคอร์ต');
  if (!court) return showMsg(liveId ? 'กำลังเชื่อมต่อ… ถ้านานเกิน 10 วินาทีให้ตรวจอินเทอร์เน็ต หรือผู้จัดยังไม่ได้เปิดข้อมูลคอร์ตนี้' : 'ไม่พบข้อมูลคอร์ตนี้ในเครื่องนี้ ให้สแกน QR ใหม่จากหน้าผู้จัด');
  $('msg').classList.remove('on');
  const c = ensure(court), v = side(), a = act(c);
  if (viewSet === a) viewSet = null;
  const vi = viewSet === null ? a : viewSet, viewingLive = vi === a;
  const live = c.status === 'LIVE', begun = began(c), running = live && begun && !c.paused;
  const sv = server(c);
  const [wa, wb] = setsWon(c);
  const catTxt = c.catName || String(c.round || '').split('•').map((x) => x.trim())[1];

  // header
  const live0 = c.status === 'LIVE';
  const mno = ((String(c.round || '').match(/#\s*(\d+)/) || [])[1]) || '';
  $('tname').textContent = c.tournament || 'การแข่งขันแบดมินตัน';
  const mnum = c.matchNo || mno;
  const rtxt = c.roundLabel || c.catName ? [c.roundLabel, c.catName].filter(Boolean).join(' - ') : String(c.round || '').replace('•', '-').replace(/\s+/g, ' ');
  $('tsub').textContent = 'สนาม ' + courtNo + (live0 && mnum ? ' | แมตช์ #' + mnum : '') + (live0 && rtxt ? ' ' + rtxt : '') + (umpire ? ' | umpire-' + umpire : '');
  $('livep').className = 'livep' + (running ? '' : live && begun ? ' paused' : ' idle');
  $('livetxt').textContent = running ? 'LIVE' : live && begun ? 'PAUSED' : live ? 'READY' : 'IDLE';

  // players in each team can swap places: tap before the match starts, then they swap every time the serving side holds serve
  const entries = c.log.filter((e) => Number(e[1]) === vi);
  const flips = { A: !!c.swapA, B: !!c.swapB };
  let prev = (Array.isArray(c.firstSrv) && c.firstSrv[vi]) || null;
  entries.forEach((e) => { if (e[0] === prev) flips[e[0]] = !flips[e[0]]; prev = e[0]; });

  // team cards + big scores (sides follow the "swap sides" setting)
  for (const sd of ['L', 'R']) {
    const t = v[sd], ns = names(c, t), photos = (t === 'A' ? c.photoA : c.photoB) || [];
    const slots = [0, 1].slice(0, Math.max(1, Math.min(2, ns.length)));
    if (flips[t] && slots.length === 2) slots.reverse();
    const pts = c.scores[vi][T(t)];
    const serverSlot = sv === t && slots.length === 2 ? (pts % 2 === 0 ? 1 : 0) : (sv === t ? 0 : -1);
    $('tc' + sd).dataset.t = t; $('sb' + sd).dataset.t = t;
    $('h' + sd).textContent = teamName(c, t);
    $('ph' + sd).dataset.t = t;
    $('ph' + sd).classList.toggle('canswap', !begun && canWrite && slots.length === 2);
    const real = (t === 'A' ? c.realA : c.realB) || [];
    $('ph' + sd).innerHTML = slots.map((k, pos) => {
      const u = safeUrl(photos[k]);
      return `<div class="pw"><div class="pic${pos === serverSlot ? ' srv' : ''}"><div class="pi">${u ? `<img src="${esc(u)}" alt="${esc(ns[k] || '')}">` : k + 1}</div>${real[k] ? `<div class="real">${esc(real[k])}</div>` : ''}${pos === serverSlot ? `<span class="ball">${shuttle(34, true)}</span>` : ''}</div><div class="pnm">${esc(ns[k] || '')}</div></div>`;
    }).join('');
    $('n' + sd).textContent = c.scores[vi][T(t)];
    $('l' + sd).textContent = viewingLive ? 'คะแนนปัจจุบัน' : 'คะแนนเซตที่ ' + (vi + 1);
  }
  { const r = R(c);
    const sets = r.playTwo ? 'แข่ง 2 เซต' : r.best_of === 1 ? '1 เซต' : (r.best_of === 3 ? '2 ใน 3 เซต' : r.best_of === 5 ? '3 ใน 5 เซต' : r.best_of + ' เซต');
    $('rulet').textContent = 'กติกา : ' + sets + ' ' + r.points + ' แต้ม ' + (r.deuce ? 'ดิวถึง ' + r.cap : 'ไม่ดิว'); }
  $('cat').textContent = catTxt || ''; $('setlab').textContent = 'SET ' + (vi + 1);
  const wl = v.L === 'A' ? wa : wb, wr = v.L === 'A' ? wb : wa;
  $('won').innerHTML = `<b>${wl}</b> <b>-</b> ${wr}`;
  $('midst').textContent = !viewingLive ? 'กำลังดูเซตที่ ' + (vi + 1) : !live ? 'คอร์ตว่าง' : c.paused ? 'พักการแข่งขัน' : !begun ? 'พร้อมเริ่ม' : 'กำลังแข่งขัน';

  // point history of the viewed set
  const sc = c.scores[vi], cnt = { A: 0, B: 0 };
  const missing = sc[0] + sc[1] - entries.length;
  let cells = missing > 0 ? `<span class="c pre" title="แต้มก่อนเริ่มบันทึก">+${missing}</span>` : '';
  entries.forEach((e) => { const t = e[0]; cnt[t] += 1; cells += `<span class="c ${t}">${cnt[t]}</span>`; });
  $('cells').innerHTML = cells || '<span class="none">ยังไม่มีแต้มในเซตนี้</span>';
  const cl = $('cells'); cl.scrollLeft = viewingLive ? cl.scrollWidth : 0;
  $('setbtns').innerHTML = Array.from({ length: maxSets(c) }, (_, i) => i).map((i) => `<button class="sbtn${i === vi ? ' view' : ''}${i === a ? ' cur' : ''}" data-set="${i}">${i + 1}</button>`).join('');
  $('timer').textContent = hms(elapsed(c));
  $('icBall').innerHTML = shuttle(36, false, '#e6ecff'); $('icSrv').innerHTML = shuttle(34, true, '#fff');
  $('srvSwap').disabled = !(canWrite && live);

  // score pad: buttons follow the sides
  ['pl1', 'mi1'].forEach((id) => { $(id).className = 'bt ' + v.L; });
  ['pr1', 'mr1'].forEach((id) => { $(id).className = 'bt ' + v.R; });
  $('swapSide').className = 'bt g swp';
  $('shNum').textContent = c.shuttleUsed;

  // one button for start / pause / resume
  const pp = $('pp');
  if (!begun) { pp.className = 'bt go'; $('ppIc').textContent = '▶'; $('ppTxt').textContent = 'เริ่มเกม'; }
  else if (c.paused) { pp.className = 'bt go'; $('ppIc').textContent = '▶'; $('ppTxt').textContent = 'เล่นต่อ'; }
  else { pp.className = 'bt bl'; $('ppIc').textContent = '⏸'; $('ppTxt').textContent = 'พักการแข่งขัน'; }

  // enable / disable
  const score = canWrite && running && viewingLive, play = canWrite && running;
  ['pl1', 'mi1', 'pr1', 'mr1', 'endSet'].forEach((id) => { $(id).disabled = !score; });
  $('undo').disabled = !(score && c.log.length);
  ['shInc', 'shDec'].forEach((id) => { $(id).disabled = !play; });
  $('pp').disabled = !(canWrite && live);
  $('endMatch').disabled = !(canWrite && live && begun);
  $('reset').disabled = !(canWrite && live);
  $('swapSide').disabled = false;

  // sets summary
  $('sumHead').innerHTML = '<th class="ttlc">ผลรายเซต</th>' + Array.from({ length: maxSets(c) }, (_, i) => `<th>Set ${i + 1}</th>`).join('');
  $('sumBody').innerHTML = ['A', 'B'].map((t) => `<tr><td><i style="background:${t === 'A' ? '#2f74ff' : '#ff3a57'}"></i>${esc(teamName(c, t))}</td>` +
    Array.from({ length: maxSets(c) }, (_, i) => i).map((i) => {
      const s = c.scores[i], played = i < a || s[0] || s[1] || (i === a && began(c));
      if (!played) return '<td class="x">-</td>';
      const win = (i < a || setWinner(s, c)) && ((t === 'A' && s[0] > s[1]) || (t === 'B' && s[1] > s[0]));
      return `<td class="${win ? 'w' : 'n'}">${s[T(t)]}</td>`;
    }).join('') + '</tr>').join('');

  // recent events
  $('swWake').classList.toggle('on', prefs.wake);
  if (note) toast(note), note = '';
  fitTexts();
}

/* ---------------- writes ---------------- */
async function commit(mutate, extraLocal) {
  if (!canWrite) return false;
  if (liveId) {
    try { await Live.updateCourt(liveId, courtNo, mutate); }
    catch (e) {
      if (e.code === 'PERMISSION_DENIED') { canWrite = false; revoked = true; note = 'รหัสถูกเปลี่ยนแล้วหรือไม่มีสิทธิ์ ให้ขอ QR ใหม่จากผู้จัด'; }
      else note = 'ส่งไม่สำเร็จ: ' + (e.code || e.message);
      draw(); return false;
    }
  } else { local.edit(mutate, extraLocal); court = local.court(); }
  draw(); return true;
}
// in-page confirm (the browser confirm() is blocked or ignored in some phone webviews / fullscreen)
function ask(title, body, yes = 'ตกลง', no = 'ยกเลิก') {
  return new Promise((res) => {
    $('askT').textContent = title; $('askB').textContent = body; $('askYes').textContent = yes; $('askNo').textContent = no;
    $('ask').classList.add('on');
    const done = (v) => { $('ask').classList.remove('on'); $('askYes').onclick = $('askNo').onclick = null; res(v); };
    $('askYes').onclick = () => done(true); $('askNo').onclick = () => done(false);
  });
}
const vibe = () => { try { navigator.vibrate && navigator.vibrate(18); } catch {} };

// sets won so far (the set being played counts once it has a winner)
function wonSets(c) {
  const cur = act(c); let a = 0, b = 0;
  c.scores.forEach((s, i) => { if (i > cur) return; if (i < cur || setWinner(s, c)) { if (s[0] > s[1]) a++; else if (s[1] > s[0]) b++; } });
  return [a, b];
}
const matchDecided = (c) => {
  const r = R(c), i = act(c), [a, b] = wonSets(c);
  if (r.playTwo) return i >= 1 && !!setWinner(c.scores[i], c);
  const need = Math.floor(Math.max(1, r.best_of || 3) / 2) + 1;
  return a >= need || b >= need;
};
// after a point: if the set is won, offer to move on (next set, or finish the match)
async function maybeEndSet() {
  const c = court && ensure(court), i = c && act(c);
  if (!c || !setWinner(c.scores[i], c)) return;
  const sc = `${c.scores[i][0]} - ${c.scores[i][1]}`;
  const w = setWinner(c.scores[i], c);
  if (matchDecided(c) || i >= maxSets(c) - 1) {
    if (await ask(`เซตที่ ${i + 1} จบแล้ว (${sc})`, `${teamName(c, w)} ชนะเซตนี้ — จบการแข่งขันเลยไหม?`, 'จบการแข่งขัน', 'ยังไม่จบ (แก้คะแนน)')) await finishMatch(true);
    return;
  }
  if (await ask(`เซตที่ ${i + 1} จบแล้ว (${sc})`, `${teamName(c, w)} ชนะเซตนี้ — ไปเซตถัดไปเลยไหม?`, 'ไปเซตถัดไป', 'ยังไม่ (แก้คะแนน)')) await commit(endSetMut);
}

$('sc').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-p]'); if (!b || b.disabled) return;
  const t = side()[b.dataset.s], n = Number(b.dataset.p);
  vibe();
  if (n > 0) { if (await commit(addPoints(t, n))) maybeEndSet(); }
  else commit(subPoints(t, -n));
});
for (const sd of ['L', 'R']) $('ph' + sd).addEventListener('click', (e) => {
  if (!e.target.closest('.pw')) return;
  const c = court && ensure(court); if (!c || began(c) || !canWrite) return;
  const t = $('ph' + sd).dataset.t;
  commit((x) => { if (t === 'A') x.swapA = !x.swapA; else x.swapB = !x.swapB; });
});
$('undo').onclick = () => commit(undo);
$('swapSide').onclick = () => { prefs.flip = !prefs.flip; savePrefs(); draw(); };
$('srvSwap').onclick = () => commit((c) => { ensure(c); c.server = c.server === 'A' ? 'B' : c.server === 'B' ? 'A' : (server(c) === 'A' ? 'B' : 'A'); pushEv(c, 'ผู้เสิร์ฟ: ' + teamName(c, c.server)); });
$('shInc').onclick = () => commit((c) => { ensure(c); c.shuttleUsed += 1; pushEv(c, `ลูกที่ ${c.shuttleUsed} ${teamName(c, server(c) || 'A')}`); });
$('shDec').onclick = () => commit((c) => { if (c.shuttleUsed > 0) c.shuttleUsed -= 1; });
$('pp').onclick = () => { requestWake(); commit(playPause); };
$('endSet').onclick = async () => {
  const c = ensure(court), i = act(c);
  if (i >= maxSets(c) - 1) return toast('นี่คือเซตสุดท้าย กด "จบการแข่งขัน"');
  if (!setWinner(c.scores[i], c) && !(await ask('จบเซตนี้?', `คะแนนยังไม่ถึงเกณฑ์จบเซต (${R(c).points} แต้ม) จบเซตนี้เลยไหม?`, 'จบเซต', 'ยกเลิก'))) return;
  commit(endSetMut);
};
$('setbtns').addEventListener('click', (e) => { const b = e.target.closest('[data-set]'); if (b) { viewSet = Number(b.dataset.set); draw(); } });

const wipe = (x) => {
  x.scores = [[0, 0], [0, 0], [0, 0]]; x.shuttleUsed = 1; x.activeSet = 0; x.server = ''; x.swapA = false; x.swapB = false; x.firstSrv = ['', '', '']; x.paused = false;
  x.startedAt = 0; x.pausedAt = 0; x.pausedTotal = 0; x.log = []; x.events = [];
};
$('reset').onclick = async () => {
  if (!(await ask('ยกเลิก/รีเซ็ตแมตช์นี้?', 'คะแนน เซต ลูกแบด และประวัติเหตุการณ์จะถูกล้างทั้งหมด (ทีมยังคงอยู่)', 'รีเซ็ต', 'ไม่'))) return;
  viewSet = null; commit((c) => { ensure(c); wipe(c); pushEv(c, 'รีเซ็ตแมตช์'); });
};
$('endMatch').onclick = () => finishMatch(false);
async function finishMatch(skipAsk) {
  const c = ensure(court), cur = act(c);
  let a = 0, b = 0;
  c.scores.forEach((s, i) => { if (i <= cur && (s[0] || s[1])) { if (s[0] > s[1]) a++; else if (s[1] > s[0]) b++; } });
  const isDraw = R(c).playTwo && a === b;
  const aWin = a !== b ? a > b : c.scores.reduce((n, s) => n + s[0] - s[1], 0) >= 0;
  if (!skipAsk && !(await ask('จบการแข่งขัน?', `เซตที่ชนะ ${a} - ${b}\n${isDraw ? 'ผลเสมอ (ทีมละ 1 คะแนน)' : 'ผู้ชนะ ' + teamName(c, aWin ? 'A' : 'B')}`, 'จบการแข่งขัน', 'ยกเลิก'))) return;
  const label = (t) => `${players(c, t)} (${clubOf(c, t)})`;
  const done = {
    courtNo, slot: 'c' + courtNo,
    code: c.matchCode || ('M-' + Math.floor(105 + Math.random() * 80)),
    round: c.round,
    winner: label(aWin ? 'A' : 'B'), loser: label(aWin ? 'B' : 'A'),
    scoreText: c.scores.filter((s, i) => i === 0 || s[0] > 0 || s[1] > 0).map((s) => s[0] + '-' + s[1]).join(', '),
    shuttleUsed: c.shuttleUsed,
    time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.',
  };
  const reset = (x) => {
    wipe(x); x.status = 'READY'; x.matchCode = ''; x.round = 'คอร์ทว่าง (พร้อมเรียกคู่ถัดไป)';
    x.teamA = 'รอเรียกคู่แข่งขัน'; x.clubA = '-'; x.teamB = 'รอเรียกคู่แข่งขัน'; x.clubB = '-'; x.activeSet = -1; x.photoA = []; x.photoB = [];
  };
  viewSet = null;
  if (liveId) {
    try { await Live.addCompleted(liveId, done); }
    catch (e) { note = e.code === 'PERMISSION_DENIED' ? 'รหัสถูกเปลี่ยนแล้ว ให้ขอ QR ใหม่จากผู้จัด' : 'บันทึกผลไม่สำเร็จ: ' + (e.code || e.message); return draw(); }
    await commit(reset);
  } else {
    await commit(reset, (st) => { (st.completedMatches = st.completedMatches || []).unshift(done); });
  }
}

/* ---------------- events dialog, settings, fullscreen, wake lock ---------------- */
$('evAll').onclick = () => {
  const c = court && ensure(court); if (!c) return;
  $('evList').innerHTML = c.events.length ? c.events.slice().reverse().map((e) => `<div><b>${clockTxt(e.at)}</b><span>${esc(e.txt)}</span></div>`).join('') : '<div>ยังไม่มีเหตุการณ์</div>';
  $('evModal').classList.add('on');
};
$('closeEv').onclick = $('xEv').onclick = () => $('evModal').classList.remove('on');
$('gear').onclick = () => $('modal').classList.add('on');
$('closeModal').onclick = $('xModal').onclick = () => $('modal').classList.remove('on');
for (const id of ['modal', 'evModal']) $(id).addEventListener('click', (e) => { if (e.target.id === id) $(id).classList.remove('on'); });
document.querySelectorAll('input[name=fitmode]').forEach((r) => { r.checked = r.value === prefs.fit; r.onchange = () => { prefs.fit = r.value; savePrefs(); fit(); }; });
let wakeLock = null;
async function requestWake() { if (!prefs.wake || !('wakeLock' in navigator)) return; try { wakeLock = await navigator.wakeLock.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') requestWake(); });
$('optWake').onclick = () => { prefs.wake = !prefs.wake; savePrefs(); if (prefs.wake) requestWake(); else { try { wakeLock && wakeLock.release(); } catch {} } draw(); };

const fsEl = document.documentElement;
const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
async function toggleFullscreen() {
  try {
    if (fsOn()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const req = fsEl.requestFullscreen || fsEl.webkitRequestFullscreen;
    if (!req) return toast('iPhone ยังไม่รองรับเต็มจอบนเบราว์เซอร์ ให้กดปุ่มแชร์ แล้วเลือก "เพิ่มไปยังหน้าจอโฮม" จะเปิดแบบเต็มจอได้');
    await req.call(fsEl);
    try { await screen.orientation.lock('landscape'); } catch { /* not allowed on this device */ }
  } catch (e) { toast('เปิดเต็มจอไม่สำเร็จ: ' + (e.message || e)); }
}
const FS_IN = '<svg class="fsi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const FS_OUT = '<svg class="fsi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
const syncFs = () => { $('fsBtn').innerHTML = fsOn() ? FS_OUT : FS_IN; setTimeout(fit, 150); };
syncFs();
['fullscreenchange', 'webkitfullscreenchange'].forEach((ev) => document.addEventListener(ev, syncFs));
$('fsBtn').onclick = toggleFullscreen;


setInterval(() => {
  $('clock').textContent = clockTxt(Date.now());
  if (court) $('timer').textContent = hms(elapsed(ensure(court)));
}, 1000);
$('clock').textContent = clockTxt(Date.now());
if (prefs.wake) requestWake();

/* ---------------- start ---------------- */
draw();
if (liveId) {
  Live.connect(liveId, { courtNo, key: secret }).then((r) => {
    canWrite = r.canWrite;
    if (r.denied) revoked = true;
    if (r.error === 'auth') note = 'เปิด Anonymous sign-in ใน Firebase ก่อน (' + (r.detail || '') + ')';
    else if (r.error === 'nokey' || r.error === 'badkey') note = 'ลิงก์ไม่มีรหัสของคอร์ตนี้ ดูอย่างเดียว ให้สแกน QR ใหม่';
    draw();
  });
  Live.watchConnection((on) => { online = on; if (!on) toast('ออฟไลน์ ระบบจะส่งข้อมูลเมื่อกลับมาออนไลน์'); });
  Live.watchCourt(liveId, courtNo, (c) => { court = c; draw(); });
  // organizer may rotate the court key at any time: re-prove the key regularly and lock the page if it was revoked
  const recheck = () => { if (revoked) return; Live.connect(liveId, { courtNo, key: secret }).then((r) => { if (r.denied) { revoked = true; canWrite = false; draw(); } }); };
  setInterval(recheck, 8000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) recheck(); });
} else {
  canWrite = true; court = local.court();
  window.addEventListener('storage', (e) => { if (e.key === LOCAL_KEY) { court = local.court(); draw(); } });
  draw();
}
</script>
</body>
