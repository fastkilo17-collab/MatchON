<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MatchON · Live Score</title>
<link rel="icon" type="image/png" href="img/matchon-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0b1220;color:#e8eefc;font-family:'Noto Sans Thai',sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;border-bottom:1px solid #1d2a47;flex:0 0 auto}
.logo{font:800 20px 'Prompt'}.logo b{color:#f5b301}
#tname{font:700 18px 'Noto Sans Thai';color:#cfe0ff;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#conn{font-size:12px;color:#7d8fb3;white-space:nowrap}
#fs{background:#16294d;color:#cfe0ff;border:1px solid #2b4170;border-radius:10px;min-height:34px;padding:0 12px;font:600 13px 'Noto Sans Thai';cursor:pointer}
main{flex:1 1 auto;min-height:0;display:grid;gap:10px;padding:10px 12px;font-size:16px;overflow:auto}
.card{background:#111b30;border:1px solid #22345a;border-radius:1.1em;padding:max(1em,14px) max(1.4em,18px) max(1.2em,16px);display:flex;flex-direction:column;gap:.4em;min-width:0;min-height:0;overflow:hidden}
.card.live{border-color:#ef4444;box-shadow:0 0 0 1px #ef444455}
.top{display:flex;align-items:center;justify-content:space-between;gap:.5em}
.court{font:800 1.4em 'Prompt'}.court small{font:700 .55em 'Noto Sans Thai';color:#7fb0ff;background:#16294d;border-radius:.5em;padding:.15em .5em;margin-left:.4em;vertical-align:middle}
.st{font:700 .8em 'Noto Sans Thai';color:#7d8fb3}.st.l{color:#ff6b6b}
.cat{font-size:.88em;color:#a9bbdd;line-height:1.25}.rule{font-size:.75em;color:#7d8fb3}
.row{display:grid;grid-template-columns:1fr auto auto auto auto;align-items:center;gap:.6em;padding:.3em 0;border-top:1px solid #1d2a47;flex:0 0 auto}
.who{display:flex;align-items:center;gap:.6em;min-width:0}
.ph{display:flex;gap:.25em;flex:0 0 auto}.ph img,.ph i{width:2.2em;height:2.2em;border-radius:50%;object-fit:cover;background:#1d2a47;border:2px solid #2b4170;display:grid;place-items:center;font:700 1em 'Noto Sans Thai';color:#9fb0d0;font-style:normal}
.tn{font:700 1.2em/1.15 'Noto Sans Thai';min-width:0;overflow:hidden;text-overflow:ellipsis}.tn small{display:block;font:500 .6em 'Noto Sans Thai';color:#7d8fb3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{font:800 1.3em 'Prompt';min-width:1.6em;text-align:center;color:#7d8fb3}
.cur{font:800 2.3em 'Prompt';min-width:1.5em;text-align:center;color:#ffd24a}
.empty{color:#51618a;text-align:center;padding:1.2em 0;font-size:.9em}
</style>
</head>
<body>
<header><div class="logo">Match<b>ON</b></div><div id="tname">Live Score</div><div id="conn">กำลังเชื่อมต่อ…</div><button id="fs" type="button">⛶ เต็มจอ</button></header>
<main id="g"></main>
<script type="module">
import * as Live from './js/live.js';
const liveId = new URLSearchParams(location.search).get('live');
const $ = (i) => document.getElementById(i);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ruleTxt = (r) => {
  if (!r) return '';
  const sets = r.playTwo ? 'แข่ง 2 เซต' : r.best_of === 1 ? '1 เซต' : (Math.floor(r.best_of / 2) + 1) + ' ใน ' + r.best_of + ' เซต';
  return 'กติกา : ' + sets + ' ' + r.points + ' แต้ม ' + (r.deuce ? 'ดิวถึง ' + r.cap : 'ไม่ดิว');
};
function side(c, k) {
  const t = c['team' + k], club = c['club' + k];
  const real = c['real' + k] || [];
  const ph = (c['photo' + k] || []).map((u, i) => u ? `<img src="${esc(u)}" alt="" referrerpolicy="no-referrer">` : `<i>${esc(([...(real[i] || t || '?')][0]) || '?')}</i>`).join('');
  return `<div class="who"><div class="ph">${ph}</div><div class="tn">${esc(club || t)}${club ? `<small>${esc(t)}</small>` : ''}</div></div>`;
}
function card(c) {
  const live = c.status === 'LIVE';
  const act = c.activeSet >= 0 ? c.activeSet : 0;
  const done = [0, 1, 2].filter((i) => i !== act && (c.scores[i][0] || c.scores[i][1]));
  const cell = (k, i) => `<div class="sc${i === act ? ' act' : ''}">${c.scores[i][k]}</div>`;
  const rows = ['A', 'B'].map((L, k) => `<div class="row">${side(c, L)}${[0, 1, 2].filter((i) => i < act).map((i) => cell(k, i)).join('')}<div class="cur">${c.scores[act][k]}</div></div>`).join('');
  const head = `<div class="top"><div class="court">สนาม ${c.courtNo}${c.matchNo ? '<small>แมตช์ #' + c.matchNo + '</small>' : ''}</div><div class="st${live ? ' l' : ''}">${live ? '● LIVE' : 'ว่าง'}</div></div>`;
  if (!live) return `<div class="card">${head}<div class="empty">รอเรียกคู่แข่งขัน</div></div>`;
  return `<div class="card live">${head}<div class="cat">${esc([c.catName, c.roundLabel].filter(Boolean).join(' · ') || c.round)}</div><div class="rule">${esc(ruleTxt(c.rule))}</div>${rows}</div>`;
}
let N = 0;
function layout() {
  const m = $('g');
  if (!N) return;
  const W = m.clientWidth - 24, H = m.clientHeight - 20;
  let best = null;
  for (let cols = 1; cols <= N; cols++) {
    const rows = Math.ceil(N / cols);
    const u = Math.min((W / cols - 10) / 21, (H / rows - 10) / 17);
    if (!best || u > best.u) best = { cols, rows, u };
  }
  m.style.gridTemplateColumns = `repeat(${best.cols},minmax(0,1fr))`;
  m.style.gridAutoRows = `${Math.max(120, H / best.rows - 10)}px`;
  m.style.fontSize = Math.max(9, Math.min(40, best.u)) + 'px';
}
window.addEventListener('resize', layout);
document.addEventListener('fullscreenchange', () => setTimeout(layout, 100));
$('fs').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement).catch(() => {});
};
if (!liveId) { $('g').innerHTML = '<div class="empty">ลิงก์ไม่ถูกต้อง (ไม่มีรหัสรายการ)</div>'; }
else {
  Live.watchConnection((on) => { $('conn').textContent = on ? '● ออนไลน์' : 'ออฟไลน์'; });
  Live.watchCourts(liveId, (list) => {
    if (!list || !list.length) { $('g').innerHTML = '<div class="empty">ยังไม่มีข้อมูลสนาม</div>'; return; }
    $('tname').textContent = (list.find((c) => c.tournament) || {}).tournament || 'Live Score';
    $('g').innerHTML = list.map(card).join('');
    N = list.length; layout();
  });
}
</script>
</body>
</html>
